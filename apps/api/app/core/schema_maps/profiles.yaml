  skills:
    column: core_skills
    confidence: high
    kind: skills_with_proficiency
    required: false
    parser:
      delimiter: ","
      proficiency_pattern: '\(([^)]+)\)'         # captures "(Beginner)" → "Beginner"
      proficiency_levels: [Beginner, Advanced Beginner, Competent, Proficient, Expert]
    notes:
      - "Format: 'Skill Name (Proficiency), Skill Name (Proficiency), …'"

  secondary_skills:
    column: secondary_skills
    confidence: high
    kind: skills_with_proficiency
    required: false
    parser: { delimiter: ",", proficiency_pattern: '\(([^)]+)\)', proficiency_levels: [Beginner, Advanced Beginner, Competent, Proficient, Expert] }

  soft_skills:
    column: soft_skills
    confidence: high
    kind: skills_with_proficiency
    required: false
    parser: { delimiter: ",", proficiency_pattern: '\(([^)]+)\)', proficiency_levels: [Beginner, Advanced Beginner, Competent, Proficient, Expert] }
    notes:
      - "Often NaN — guard for missing rows."

  potential_roles:
    column: potential_roles
    confidence: high
    kind: role_list
    required: false
    parser: { delimiter: "," }
    notes:
