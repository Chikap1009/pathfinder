# Proficiency ordinal scale (Dreyfus model) for filtering & ranking.
proficiency_ordinal:
  Beginner: 1
  Advanced Beginner: 2
  Competent: 3
  Proficient: 4
  Expert: 5

# Canonical text used for BGE-M3 indexing (joined at ETL time).
# This is the field BM25 + dense + sparse + ColBERT all index over.
canonical_text_template: |
  {name}
  Skills: {core_skills}
