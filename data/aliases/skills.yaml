# Hand-curated skill aliases. Layer 1 of the canonicalisation pipeline.
# Format:
#   <canonical_name>:                   # the form we want to keep
#     - <alias_or_abbreviation>         # forms that map TO the canonical
#     - <other_alias>
#
# Lower-case lookup; keys + values both compared in lower-case. The script
# preserves the canonical's casing in the output.
#
# Keep this list short and obvious. The ESCO API + embedding fallback handle
# the long tail. We only need entries here for cases where neither layer can
# infer the mapping correctly.

